quarkus.application.name=narration-service
quarkus.banner.path=banner.txt

## Default OpenAI configuration
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.enable-integration=false
quarkus.langchain4j.openai.api-key=change-me
quarkus.langchain4j.openai.timeout=60s
quarkus.langchain4j.openai.max-retries=3
quarkus.langchain4j.openai.chat-model.temperature=0.7

## HTTP configuration
quarkus.http.port=8087
quarkus.jackson.serialization-inclusion=non-empty

## Logging configuration
quarkus.log.category."app.sightsoundwalk".level=DEBUG
quarkus.log.level=INFO

# OpenAPI
quarkus.smallrye-openapi.info-title=Sight-Sound-Walk Narration API
quarkus.smallrye-openapi.info-description=AI-powered Tour Guide narration for historical monuments.
quarkus.smallrye-openapi.info-version=1.0
quarkus.swagger-ui.always-include=true

# Container image
quarkus.container-image.name=${quarkus.application.name}
